<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals, Kadin Adams, Resources, Explore Utah's parks">
    <meta name="author" content="Kadin Adams">
    <title>Explore Utah's National Parks</title>
    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <script src="scripts/project.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="parks.html">Parks</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Welcome to Utah's National Parks</h1>
        <p>Your guide to the stunning beauty and adventures that await you.</p>
        <form action="feedback.html" method="get" id="parkFeedbackForm">
            <h2>Park Experience Feedback</h2>
            
            <label for="parkName">Park Name</label>
            <select id="parkName" name="parkName" required>
                <option value="" disabled selected>Select a Park ...</option>
            </select>
        
            <fieldset>
                <legend>Overall Experience Rating</legend>
                <label>
                    <input type="radio" id="rating1" name="overallRating" value="1" required>
                    ☆
                </label>
                <label>
                    <input type="radio" id="rating2" name="overallRating" value="2" required>
                    ☆☆
                </label>
                <label>
                    <input type="radio" id="rating3" name="overallRating" value="3" required>
                    ☆☆☆
                </label>
                <label>
                    <input type="radio" id="rating4" name="overallRating" value="4" required>
                    ☆☆☆☆
                </label>
                <label>
                    <input type="radio" id="rating5" name="overallRating" value="5" required>
                    ☆☆☆☆☆
                </label>
            </fieldset>
        
            <label for="visitDate">Date of Visit</label>
            <input type="date" id="visitDate" name="visitDate" required>
        
            <fieldset>
                <legend>Which activities did you enjoy? [Check all that apply.]</legend>
                <label>
                    <input type="checkbox" id="activity1" name="enjoyedActivities" value="Hiking">
                    Hiking
                </label>
                <label>
                    <input type="checkbox" id="activity2" name="enjoyedActivities" value="Camping">
                    Camping
                </label>
                <label>
                    <input type="checkbox" id="activity3" name="enjoyedActivities" value="Wildlife Watching">
                    Wildlife Watching
                </label>
                <label>
                    <input type="checkbox" id="activity4" name="enjoyedActivities" value="Photography">
                    Photography
                </label>
            </fieldset>
        
            <label for="writtenReview">Written Feedback (optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
        
            <label for="userName">Your Name (optional)</label>
            <input type="text" id="userName" name="userName">
        
            <input type="submit" value="Submit Feedback">
        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> Kadin Adams, UT</p>
        <p>lastmodified</p>
    </footer>
</body>
</html>
